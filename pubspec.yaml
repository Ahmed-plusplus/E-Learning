name: elearning
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  supabase_flutter: ^2.17.2
  youtube_player_flutter: ^10.0.1
  dartz: ^0.10.1
  get_it: ^9.3.0
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.0.10
  go_router: ^18.0.1
  flutter_secure_storage: ^11.2.0
  cached_network_image: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: NimbusSans
      fonts:
        - asset: assets/fonts/NimbusSans.ttf
    - family: PTSansCaption
      fonts:
        - asset: assets/fonts/PTSansCaption.ttf
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans.ttf
